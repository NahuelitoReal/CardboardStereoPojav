buildscript {
    repositories {
        jcenter()
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

version = "1.0.0"
group = "com.cardboardstereo"
archivesBaseName = "CardboardStereo"

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"

    // "stable_22" is the MCP mapping set commonly used for 1.8.9.
    // If ForgeGradle complains this mapping is gone from the index,
    // swap to the latest "stable_*" or "snapshot_*" listed for 1.8.9
    // at http://export.mcpbot.bspatchd.de (or the mirror ForgeGradle
    // resolves) - the mapping version does NOT change any of the public
    // API this project uses, only some private/obfuscated names.
    mappings = "stable_22"

    replaceIn "CardboardStereoMod.java"
    replace "@VERSION@", project.version
}

repositories {
    mavenCentral()
}

dependencies {
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
